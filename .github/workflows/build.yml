name: Build SimulateTouch DEB

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid dpkg
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Install old iOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p $THEOS/sdks
          cp -r /tmp/sdks/iPhoneOS9.3.sdk $THEOS/sdks/

      - name: Build package
        run: |
          make clean
          make package SDKVERSION=9.3 ARCHS=armv7 ADDITIONAL_CFLAGS="-fno-modules"
        env:
          THEOS: ${{ env.THEOS }}

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: SimulateTouch-deb
          path: packages/*.deb
