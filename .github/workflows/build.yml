name: Build SimulateTouch DEB

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid dpkg
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Install old iOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p $THEOS/sdks
          cp -r /tmp/sdks/iPhoneOS9.3.sdk $THEOS/sdks/

      - name: Fix module.map names in old SDK
        run: |
          find $THEOS/sdks/iPhoneOS9.3.sdk -name "module.map" -print0 | \
            while IFS= read -r -d '' f; do
              mv "$f" "$(dirname "$f")/module.modulemap"
            done

      - name: Build package
        run: |
          make clean
          make package SDKVERSION=9.3 ARCHS=armv7
        env:
          THEOS: ${{ env.THEOS }}

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: SimulateTouch-deb
          path: packages/*.deb
