name: Build SimulateTouch DEB

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:   # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid dpkg
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      # Opcional: descargar un SDK antiguo si el proyecto lo necesita
      # - name: Install old SDK
      #   run: |
      #     git clone https://github.com/theos/sdks.git /tmp/sdks
      #     cp -r /tmp/sdks/iPhoneOS9.3.sdk $THEOS/sdks/

      - name: Build package
        run: |
          make clean
          make package
        env:
          THEOS: ${{ env.THEOS }}
          ARCHS: armv7   # El proyecto original es de 32 bits (armv7)

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: SimulateTouch-deb
          path: packages/*.deb
